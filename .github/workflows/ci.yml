name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.2, 8.3, 8.4]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, mysqli, pdo_mysql
        coverage: none

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y subversion

    - name: Validate composer.json files
      run: |
        for plugin in community-listings contentful-tables graphql-shortcode-support; do
          (cd $plugin && composer validate --strict)
        done

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: |
          **/vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: make install-dev

    - name: Run PHPCS
      run: |
        for plugin in community-listings contentful-tables graphql-shortcode-support; do
          echo "Checking $plugin..."
          (cd $plugin && ./vendor/bin/phpcs --standard=phpcs.xml --warning-severity=0 .)
        done

    - name: Run PHPStan
      run: make phpstan

    - name: Run PHPUnit
      env:
        WP_TESTS_DIR: /tmp/wordpress-tests-lib
      run: make test-integration DB_HOST=127.0.0.1

    - name: Build distribution packages
      run: make build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: plugin-packages-php${{ matrix.php-version }}
        path: dist/
        retention-days: 7
